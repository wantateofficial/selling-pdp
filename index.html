<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 검색엔진·AI 크롤러 색인 차단 -->
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
    <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css"
    />
    <title>새러데이 랩</title>
    <!-- Microsoft Clarity (이용 행태 분석) -->
    <!-- 메타 픽셀과 같은 조건: 로컬 개발·이미지 캡처(?export=1)에서는 로드하지 않는다. -->
    <!-- 신청폼 입력칸은 SignupForm.tsx 에서 data-clarity-mask 로 가린다. 신청 이벤트도 거기서 보낸다. -->
    <script>
    if (!/^(localhost|127\.0\.0\.1)$/.test(location.hostname) && !/[?&]export=1/.test(location.search)) {
      (function(c,l,a,r,i,t,y){
          c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
          t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
          y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
      })(window, document, "clarity", "script", "zburj19bce");
      // 광고 지면별로 녹화를 걸러 볼 수 있게 UTM 값과 page 값을 태그로 보낸다. 값이 없으면 보내지 않는다.
      (function(){
        var q = new URLSearchParams(location.search);
        ['page','utm_source','utm_medium','utm_campaign','utm_content','utm_term'].forEach(function(k){
          var v = q.get(k);
          if (v) window.clarity('set', k, v);
        });
      })();
    }
    </script>
    <!-- Meta Pixel Code -->
    <!-- 로컬 개발(localhost)·이미지 캡처(?export=1)에서는 로드하지 않는다. 신청 완료 Lead 는 SignupForm.tsx 에서 보낸다. -->
    <script>
    if (!/^(localhost|127\.0\.0\.1)$/.test(location.hostname) && !/[?&]export=1/.test(location.search)) {
    !function(f,b,e,v,n,t,s)
    {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};
    if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
    n.queue=[];t=b.createElement(e);t.async=!0;
    t.src=v;s=b.getElementsByTagName(e)[0];
    s.parentNode.insertBefore(t,s)}(window, document,'script',
    'https://connect.facebook.net/en_US/fbevents.js');
    fbq('init', '1436604402019750');
    fbq('track', 'PageView');
    }
    </script>
    <!-- End Meta Pixel Code -->
  </head>
  <body>
    <noscript><img height="1" width="1" style="display:none"
    src="https://www.facebook.com/tr?id=1436604402019750&ev=PageView&noscript=1"
    /></noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
