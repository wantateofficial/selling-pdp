name: Connection check (draft only)
on:
  push:
    branches: [draft/ad-report-automation]
    paths: ['.github/workflows/check-connections.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check connections without exposing data
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          META_AD_ACCOUNT: ${{ secrets.META_AD_ACCOUNT }}
          META_API_VERSION: ${{ vars.META_API_VERSION }}
          CLARITY_TOKEN: ${{ secrets.CLARITY_TOKEN }}
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        run: |
          python - <<'PY'
          import json, os, urllib.request, urllib.error
          def request(label, url, token=None, payload=None):
              headers = {'Authorization': 'Bearer '+token} if token else {}
              if payload is not None: headers['Content-Type'] = 'application/json'
              try:
                  req = urllib.request.Request(url, headers=headers, data=json.dumps(payload).encode() if payload is not None else None)
                  with urllib.request.urlopen(req, timeout=25) as response:
                      raw = response.read()
                  print(label, 'OK')
                  return json.loads(raw) if label != 'SLACK' else None
              except urllib.error.HTTPError as e:
                  print(label, 'HTTP', e.code)
                  if label == 'META':
                      try:
                          error = json.loads(e.read()).get('error', {})
                          print('META error code', error.get('code'), 'subcode', error.get('error_subcode'))
                      except Exception: pass
              except Exception as e:
                  print(label, 'ERROR', type(e).__name__)
          account = os.environ.get('META_AD_ACCOUNT','').removeprefix('act_')
          version = os.environ.get('META_API_VERSION','')
          if account.isdigit() and version.startswith('v'):
              request('META', f'https://graph.facebook.com/{version}/act_{account}/insights?fields=impressions&date_preset=today', os.environ.get('META_TOKEN',''))
          else: print('META missing account or version')
          data = request('CLARITY', 'https://www.clarity.ms/export-data/api/v1/project-live-insights?numOfDays=1', os.environ.get('CLARITY_TOKEN',''))
          if isinstance(data,list):
              for metric in data:
                  name=metric.get('metricName','')
                  rows=metric.get('information',[])
                  print('CLARITY metric', name, 'fields', ','.join(sorted(rows[0].keys())) if rows else '(no rows)')
          hook=os.environ.get('SLACK_WEBHOOK','')
          if hook.startswith('https://hooks.slack.com/services/'):
              request('SLACK',hook,payload={'text':'[광고 리포트 연결 점검] 테스트 메시지입니다. 자동 보고가 시작되기 전 연결을 확인하고 있습니다.'})
          else: print('SLACK missing or invalid webhook')
          PY
