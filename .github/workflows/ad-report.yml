name: Shopping short-form ad report
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: shopping-shortform-report
  cancel-in-progress: false
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GOOGLE_WORKLOAD_PROVIDER }}
          service_account: ${{ vars.GOOGLE_SERVICE_ACCOUNT }}
      - run: python -m pip install google-auth requests
      - run: python -m unittest discover -s tests -p 'test_ad_report.py'
      - name: Send report
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          CLARITY_TOKEN: ${{ secrets.CLARITY_TOKEN }}
          META_TOKEN: ${{ secrets.META_TOKEN }}
          META_AD_ACCOUNT: ${{ secrets.META_AD_ACCOUNT }}
          META_CAMPAIGN_IDS: ${{ secrets.META_CAMPAIGN_IDS }}
          META_API_VERSION: ${{ vars.META_API_VERSION }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          SHEET_TAB: ${{ vars.SHEET_TAB }}
        run: python scripts/ad_reporting/report.py
